<body>
<div class="wrap">
<header class="topbar"><a class="brand" href="./">ACQ Media</a><button class="customize" id="edit" type="button" aria-haspopup="dialog" aria-controls="sheet">Personalizează</button></header>
<main>
<section class="intro" aria-labelledby="page-title"><p class="eyebrow">Ediția zilei</p><h1 id="page-title">Azi, pe scurt.</h1><p class="date" id="date">Ediția de azi</p></section>
<section class="section-grid" id="sections" aria-label="Secțiunile de azi"><!--CARDS-->
<a class="f" data-c="sport" href="sport.html" aria-label="Deschide secțiunea Sport" style="--folder:#172b20"><span class="folder-label" aria-hidden="true">Sport</span></a>
<a class="f" data-c="hot" href="hot.html" aria-label="Deschide secțiunea Hot" style="--folder:#301d22"><span class="folder-label" aria-hidden="true">Hot</span></a>
<a class="f" data-c="news" href="news.html" aria-label="Deschide secțiunea Știri" style="--folder:#222428"><span class="folder-label" aria-hidden="true">Știri</span></a>
<a class="f" data-c="music" href="music.html" aria-label="Deschide secțiunea Muzică" style="--folder:#19263a"><span class="folder-label" aria-hidden="true">Muzică</span></a>
<!--/CARDS--></section>
<a class="archive" href="arhiva.html"><span class="archive-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16M8 14.5h3M8 17.5h6"/></svg></span><span class="archive-copy"><span class="archive-title">Arhivă</span><span class="archive-note">Toate edițiile, zi de zi.</span></span><span class="archive-arrow" aria-hidden="true">↗</span></a>
</main>
</div>
<dialog id="sheet" aria-labelledby="sheet-title"><form method="dialog" class="sheet">
<div class="sheet-heading"><h2 id="sheet-title">Ce vrei să vezi?</h2><button class="sheet-close" value="close" aria-label="Închide personalizarea">×</button></div>
<p>Alege secțiunile care apar pe prima pagină. Alegerea se păstrează pe acest dispozitiv.</p>
<label class="sw" style="--c:#79ba93">Sport<input type="checkbox" value="sport"/><i aria-hidden="true"></i></label>
<label class="sw" style="--c:#eb959b">Hot<input type="checkbox" value="hot"/><i aria-hidden="true"></i></label>
<label class="sw" style="--c:#f2f2f5">Știri<input type="checkbox" value="news"/><i aria-hidden="true"></i></label>
<label class="sw" style="--c:#8eafe2">Muzică<input type="checkbox" value="music"/><i aria-hidden="true"></i></label>
<p id="prefs-status" role="status" aria-live="polite"></p><button class="done" type="submit" value="done">Gata</button>
</form></dialog>
<script>
(() => {
 const cards=[...document.querySelectorAll('#sections .f[data-c]')];
 const checkboxes=[...document.querySelectorAll('#sheet input[type="checkbox"]')];
 const sheet=document.querySelector('#sheet');
 const edit=document.querySelector('#edit');
 const status=document.querySelector('#prefs-status');
 const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
 document.querySelector('#date').textContent=new Intl.DateTimeFormat('ro-RO',{timeZone:'Europe/Bucharest',weekday:'long',day:'numeric',month:'long'}).format(new Date());
 const all=cards.map(card=>card.dataset.c);
 let enabled=[];
 try{enabled=JSON.parse(localStorage.getItem('acq.cats')||'[]')}catch(error){}
 if(!Array.isArray(enabled))enabled=[];
 enabled=enabled.filter(value=>all.includes(value));
 if(!enabled.length)enabled=[...all];
 function applyPreferences(){
  cards.forEach(card=>{card.hidden=!enabled.includes(card.dataset.c)});
  checkboxes.forEach(box=>{box.checked=enabled.includes(box.value)});
 }
 function savePreferences(){try{localStorage.setItem('acq.cats',JSON.stringify(enabled))}catch(error){}}
 checkboxes.forEach(box=>box.addEventListener('change',()=>{
  const selected=checkboxes.filter(input=>input.checked).map(input=>input.value);
  if(!selected.length){box.checked=true;status.textContent='Păstrează cel puțin o secțiune.';return}
  status.textContent='';enabled=selected;savePreferences();applyPreferences();
 }));
 edit.addEventListener('click',()=>{
  status.textContent='';
  if(typeof sheet.showModal==='function')sheet.showModal();else sheet.setAttribute('open','');
  document.body.classList.add('modal-open');
 });
 function closeSheet(){
  if(typeof sheet.close==='function')sheet.close();else{sheet.removeAttribute('open');document.body.classList.remove('modal-open');edit.focus()}
 }
 sheet.addEventListener('close',()=>{document.body.classList.remove('modal-open');edit.focus()});
 sheet.addEventListener('click',event=>{
  if(event.target!==sheet)return;
  const rect=sheet.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeSheet();
 });
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sheet.open&&typeof sheet.showModal!=='function')closeSheet()});
 applyPreferences();
 if('IntersectionObserver' in window&&!reducedMotion.matches){
  const observer=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('in-view');observer.unobserve(entry.target);window.setTimeout(()=>entry.target.style.removeProperty('transition-delay'),750)}});
  },{threshold:.08,rootMargin:'0px 0px -18px 0px'});
  cards.forEach((card,index)=>{card.classList.add('reveal');card.style.transitionDelay=(index%2)*60+'ms';observer.observe(card)});
 }
})();
</script>
</body>
