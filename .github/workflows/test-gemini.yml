name: Verifică cheia Gemini

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-key:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trimite o singură cerere de verificare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          model = os.environ["GEMINI_MODEL"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          payload = {
              "contents": [{"parts": [{"text": "Răspunde exact cu ACQ_OK."}]}],
              "generationConfig": {"maxOutputTokens": 8, "temperature": 0},
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              try:
                  detail = json.loads(error.read().decode("utf-8")).get("error", {}).get("message", "")
              except Exception:
                  detail = ""
              print(f"Gemini API a răspuns cu HTTP {error.code}: {detail or 'cererea a eșuat'}")
              sys.exit(1)

          if not isinstance(result, dict):
              print("Gemini a răspuns cu un conținut care nu este un obiect JSON.")
              sys.exit(1)

          answer = "".join(
              part.get("text", "")
              for candidate in result.get("candidates", [])
              for part in candidate.get("content", {}).get("parts", [])
          )
          if "ACQ_OK" not in answer:
              print(f"Gemini a răspuns cu HTTP 200, dar nu cu textul de verificare așteptat: {answer!r}")
              sys.exit(1)

          usage = result.get("usageMetadata", {})
          print(f"Cheia Gemini API a fost acceptată; modelul {model} a răspuns corect într-o singură cerere.")
          print(f"Tokenuri: {usage.get('promptTokenCount', 'n/a')} la intrare, {usage.get('candidatesTokenCount', 'n/a')} la ieșire.")
          PY
