name: Gemini API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-key:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one minimal Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          model = os.environ["GEMINI_MODEL"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          payload = {
              "contents": [{"parts": [{"text": "Răspunde exact cu ACQ_OK."}]}],
              "generationConfig": {"maxOutputTokens": 8, "temperature": 0},
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              try:
                  detail = json.loads(error.read().decode("utf-8")).get("error", {}).get("message", "")
              except Exception:
                  detail = ""
              print(f"Gemini API returned HTTP {error.code}: {detail or 'request failed'}")
              sys.exit(1)

          answer = "".join(
              part.get("text", "")
              for candidate in result.get("candidates", [])
              for part in candidate.get("content", {}).get("parts", [])
          )
          if "ACQ_OK" not in answer:
              print(f"Gemini answered, but not with the expected marker. Model: {model}")
              sys.exit(1)
          print(f"Gemini API key works; {model} returned the expected marker.")
          PY
