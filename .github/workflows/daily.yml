name: Știri zilnice

on:
  push:
    branches: [main]
    paths:
      - index.html
      - home.css
      - scripts/statics.py
      - scripts/generate.py
      - scripts/export_instagram.py
      - scripts/requirements-social.txt
      - scripts/test_export_instagram.py
      - scripts/provenance.py
      - scripts/feeds.json
      - scripts/day_template.html
      - site-ui.js
      - site-ui.css
      - icons/**
      - manifest.webmanifest
      - sport.html
      - hot.html
      - news.html
      - music.html
      - contact.html
      - contact.css
      - contact.js
      - .github/workflows/daily.yml
  schedule:
    - cron: "30 4 * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Doar republică fișierele existente, fără generare AI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descarcă ultima versiune main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurează Python
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: pip install -r scripts/requirements.txt
      - name: Rezervă plafonul zilnic Gemini
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: python -B -u scripts/generate.py --reserve-gemini
      - name: Salvează rezervarea înainte de apelul API
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: bash scripts/save_edition.sh "Rezervare Gemini"
      - name: Generează articolele sau păstrează ediția existentă
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: python -B -u scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează ediția și sincronizează main
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: bash scripts/save_edition.sh "Ediția"
      - name: Verifică minimum patru știri pe fiecare secțiune
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Europe/Bucharest")).strftime("%Y-%m-%d")
          path = Path("scripts/data/archive") / f"{today}.json"
          if not path.is_file():
              raise SystemExit(f"Lipsește ediția nouă pentru {today}.")
          edition = json.loads(path.read_text(encoding="utf-8"))
          counts = {section: len(edition.get(section, [])) for section in ("sport", "hot", "news", "music")}
          missing = {section: count for section, count in counts.items() if count < 4}
          print(f"Știri validate pe secțiune: {counts}")
          if missing:
              details = ", ".join(f"{section}: {count}" for section, count in missing.items())
              raise SystemExit(f"Ediția incompletă; nu o public. Sunt necesare minimum 4 știri pe secțiune: {details}.")
          PY

      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

