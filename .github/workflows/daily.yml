name: Știri zilnice

on:
  push:
    branches: [main]
    paths:
      - index.html
      - home.css
      - scripts/statics.py
      - scripts/generate.py
      - scripts/export_instagram.py
      - scripts/requirements-social.txt
      - scripts/test_export_instagram.py
      - scripts/provenance.py
      - scripts/feeds.json
      - scripts/day_template.html
      - site-ui.js
      - site-ui.css
      - icons/**
      - manifest.webmanifest
      - sport.html
      - hot.html
      - news.html
      - music.html
      - contact.html
      - contact.css
      - contact.js
      - .github/workflows/daily.yml
  schedule:
    - cron: "30 4 * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Doar republică fișierele existente, fără generare AI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descarcă ultima versiune main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurează Python
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: pip install -r scripts/requirements.txt
      - name: Rezervă plafonul zilnic Gemini
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: python -B -u scripts/generate.py --reserve-gemini
      - name: Salvează rezervarea înainte de apelul API
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: bash scripts/save_edition.sh "Rezervare Gemini"
      - name: Generează articolele sau păstrează ediția existentă
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: python -B -u scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează ediția și sincronizează main
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testeaza-gemini]')) }}
        run: bash scripts/save_edition.sh "Ediția"
      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  instagram:
    name: Pregătește postările Instagram
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Descarcă ediția salvată
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurează Python pentru grafică
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează biblioteca de imagini
        run: pip install -r scripts/requirements-social.txt
      - name: Asigură fonturile cu diacritice
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Verifică exportul fără API
        run: python -B -m unittest discover -s scripts -p test_export_instagram.py
      - name: Generează imaginile și descrierile fără AI
        id: instagram
        run: |
          python -B scripts/export_instagram.py --output "$RUNNER_TEMP/acq-instagram"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "acq-instagram/manifest.json").read_text("utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"edition={manifest['edition_date']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Postări Instagram pregătite\n\nEdiția **{manifest['edition_date']}**: **{manifest['article_count']} imagini PNG** și descrierile lor în română.\n\nDescarcă **acq-instagram-{manifest['edition_date']}** din secțiunea Artifacts de mai jos. Verifică data ediției înainte de postare.\n\nExportul nu face apeluri AI și nu publică în Instagram.\n")
          PY
      - name: Pachet de descărcat pentru postare manuală
        uses: actions/upload-artifact@v4
        with:
          name: acq-instagram-${{ steps.instagram.outputs.edition }}
          path: ${{ runner.temp }}/acq-instagram/
          if-no-files-found: error
          retention-days: 14
