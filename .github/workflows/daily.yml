name: Știri zilnice

on:
  push:
    branches: [main]
    paths:
      - index.html
      - home.css
      - scripts/statics.py
  schedule:
    - cron: "30 4 * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Doar republică fișierele existente, fără generare AI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descarcă ultima versiune main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurează Python
        if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.publish_existing) }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.publish_existing) }}
        run: pip install -r scripts/requirements.txt
      - name: Generează ediția zilei cu AI și rezervă RSS
        if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.publish_existing) }}
        run: python -u scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează ediția și sincronizează main
        if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || !inputs.publish_existing) }}
        run: bash scripts/save_edition.sh "Ediția"
      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
