name: Știri zilnice

on:
  push:
    branches: [main]
    paths:
      - scripts/generate.py
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 în România iarna, 08:00 vara
  workflow_dispatch:
    inputs:
      publish_existing:
        description: "Publică fișierele existente, fără apel Gemini"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v4
      - name: Configurează Python
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
        run: pip install -r scripts/requirements.txt
      - name: Generează ediția zilei
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
        run: python -u scripts/generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează arhiva în repository
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
        run: |
          git config user.name "acq-bot"
          git config user.email "acq-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nu sunt modificări de salvat."
          else
            git commit -m "Ediția $(date -u +%F)"
            git push
          fi
      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
