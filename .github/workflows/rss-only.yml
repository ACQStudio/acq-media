name: Actualizează titlurile din RSS fără AI

on:
  push:
    branches: [main]
    paths:
      - scripts/feeds.json
      - scripts/save_edition.sh
      - .github/workflows/rss-only.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descarcă ultima versiune main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        run: pip install -r scripts/requirements.txt
      - name: Actualizează ediția doar din RSS
        run: python -B -u scripts/generate.py --rss-only
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează ediția și sincronizează main
        run: bash scripts/save_edition.sh "Actualizare RSS"
      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
