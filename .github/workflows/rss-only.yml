name: Actualizează titlurile din RSS fără AI

on:
  push:
    branches: [main]
    paths:
      - scripts/feeds.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v4
      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalează dependențele
        run: pip install -r scripts/requirements.txt
      - name: Actualizează ediția doar din RSS
        run: python -u scripts/generate.py --rss-only
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Salvează arhiva în repository
        run: |
          git config user.name "acq-bot"
          git config user.email "acq-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nu sunt modificări de salvat."
          else
            git commit -m "Actualizare RSS $(date -u +%F)"
            git push
          fi
      - name: Pregătește site-ul pentru GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publică site-ul
        id: deployment
        uses: actions/deploy-pages@v4
